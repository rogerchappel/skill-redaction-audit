name: CI

on:
  push:
    branches: [main, "release-candidate/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - name: Verify release check from exported source
        run: |
          export_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$export_dir"
          cd "$export_dir"
          test ! -e .git
          npm ci
          npm run release:check
